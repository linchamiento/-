spring:
  application:
    name: shengxu
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shengxu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:shengxu}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
server:
  port: 8090
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: 604800
    cookie-secure: ${COOKIE_SECURE:false}
  suno:
    base-url: ${SUNO_BASE_URL:https://www.suno-api.io}
    api-key: ${SUNO_API_KEY:}
    model: ${SUNO_MODEL:suno-v6}
  uploads: ${UPLOAD_DIR:uploads}

